name: Update Checklist Progress

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Update checklist progress and points in Issue
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const issue = context.payload.issue;
              if (!issue) {
                console.log('No issue in context; exiting.');
                return;
              }
              let body = issue.body || "";

              // 1) Удалим старый маркерный блок, если он есть
              body = body.replace(/<!-- CHECKLIST_PROGRESS_START -->[\s\S]*?<!-- CHECKLIST_PROGRESS_END -->\n?/, '').trim();

              // 2) Найдём все чекбоксы с указанием pts: - [ ] ... (20 pts)
              //    Регекс ищет "- [ ]" или "- [x]" и затем последнюю "(N pts)" на той же строке.
              const lineRegex = /- \[( |x|X)\][^\n]*\((\d+)\s*pts\)/g;
              const matches = [...body.matchAll(lineRegex)];

              // Если нет таких задач — ничего не делаем
              if (matches.length === 0) {
                console.log('No checklist items with "(N pts)" found. Nothing to update.');
                // Но если есть обычные чекбоксы без pts, можно считать их как 1pt — опция. Сейчас вы парсите pts, так что выходим.
                return;
              }

              let totalTasks = 0;
              let doneTasks = 0;
              let totalPoints = 0;
              let donePoints = 0;

              for (const m of matches) {
                totalTasks += 1;
                const checked = (m[1] === 'x' || m[1] === 'X');
                const pts = parseInt(m[2], 10) || 0;
                totalPoints += pts;
                if (checked) {
                  doneTasks += 1;
                  donePoints += pts;
                }
              }

              const percent = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
              const filledCount = Math.round(percent / 5); // 20 segments
              const filled = "█".repeat(Math.min(Math.max(filledCount,0),20));
              const empty = "░".repeat(20 - filled.length);
              const bar = `${filled}${empty}`;

              // Сформируем маркерный блок
              const progressBlock =
`<!-- CHECKLIST_PROGRESS_START -->
**Progress:** ${doneTasks}/${totalTasks} (${percent}%)
${bar}

**Points:** ${donePoints}/${totalPoints}
<!-- CHECKLIST_PROGRESS_END -->`;

              // Если уже такой же блок есть (удалили выше), то вставляем наверх
              const newBody = progressBlock + "\n\n" + body;

              // Проверим: не совпадает ли с текущим телом issue — если совпадает, не обновляем
              const currentFullBody = (issue.body || "").trim();
              if (currentFullBody === newBody.trim()) {
                console.log('No change in body; skipping update.');
                return;
              }

              // Обновляем тело Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: newBody
              });

              console.log('Issue updated with new progress block.');
            } catch (err) {
              core.setFailed(`Error: ${err.message}`);
            }
