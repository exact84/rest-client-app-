name: Update Checklist Progress

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate checklist progress and points
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // Ищем чекбоксы с баллами: - [ ] Task ... (20 pts)
            const matches = [...body.matchAll(/- \[( |x)\].*?\((\d+)\s*pts\)/gi)];

            let total = 0;
            let done = 0;
            let totalPoints = 0;
            let donePoints = 0;

            for (const m of matches) {
              const checked = m[1] === "x";
              const points = parseInt(m[2], 10);

              total += 1;
              totalPoints += points;

              if (checked) {
                done += 1;
                donePoints += points;
              }
            }

            const percent = total === 0 ? 0 : Math.round((done / total) * 100);

            // Строим полоску прогресса (20 сегментов)
            const filled = "█".repeat(Math.round(percent / 5));
            const empty = "░".repeat(20 - filled.length);
            const bar = `${filled}${empty}`;

            const progressLine = `**Progress:** ${done}/${total} (${percent}%)\n${bar}\n\n**Points:** ${donePoints}/${totalPoints}`;

            // Обновляем тело Issue
            let newBody;
            if (body.includes("**Progress:**")) {
              newBody = body.replace(/\*\*Progress:\*\*[\s\S]*?\*\*Points:\*\*.*\n?/, progressLine + "\n\n");
            } else {
              newBody = progressLine + "\n\n" + body;
            }

            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              body: newBody
            });
