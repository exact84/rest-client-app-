name: Update Checklist Progress

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Update checklist progress and points in Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            let body = issue.body || '';

            // Удаляем старый прогресс-бар
            body = body.replace(/<!-- CHECKLIST_PROGRESS_START -->[\s\S]*?<!-- CHECKLIST_PROGRESS_END -->\n?/m, '').trim();

            // Ищем чекбоксы с баллами: - [ ] ... (20 pts)
            const lineRegex = /^- \[( |x|X)\][^\n]*\((\d+)\s*pts\)/gm;
            const matches = [...body.matchAll(lineRegex)];

            if (matches.length === 0) {
              console.log("No checklist items with '(N pts)' found.");
              return;
            }

            let totalTasks = 0;
            let doneTasks = 0;
            let totalPoints = 0;
            let donePoints = 0;

            for (const m of matches) {
              totalTasks += 1;
              const checked = (m[1].toLowerCase() === 'x');
              const pts = parseInt(m[2], 10) || 0;
              totalPoints += pts;
              if (checked) {
                doneTasks += 1;
                donePoints += pts;
              }
            }

            const percent = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
            const filledCount = Math.round(percent / 5);
            const filled = '█'.repeat(Math.min(Math.max(filledCount, 0), 20));
            const empty = '░'.repeat(20 - filled.length);
            const bar = filled + empty;

            const progressBlock =
              '<!-- CHECKLIST_PROGRESS_START -->\n' +
              '**Progress:** ' + doneTasks + '/' + totalTasks + ' (' + percent + '%)\n' +
              bar + '\n\n' +
              '**Points:** ' + donePoints + '/' + totalPoints + '\n' +
              '<!-- CHECKLIST_PROGRESS_END -->';

            const newBody = progressBlock + '\n\n' + body;

            if (newBody.trim() === (issue.body || '').trim()) {
              console.log('No changes to update.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody
            });
